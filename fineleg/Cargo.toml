[package]
name = "fineleg"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1.0.100"
chrono = "0.4.39"
image = "0.25.9"
itertools = "0.14.0"
las = "0.9.6"
plotly = "0.12.1"
polars = { version = "0.45.1", features = ["cross_join", "json", "lazy", "dtype-u8", "random", "round_series"] }
reqwest = { version = "0.12.24", features = ["blocking", "json"] }
rerun = "0.27.2"
serde = "1.0.228"
serde_json = "1.0.145"
tokio = { version = "1.48.0", features = ["full"] }
